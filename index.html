<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sky Tonight Tracker</title>
</head>
<body>
  
    <h1>Sky Tonight Tracker</h1>

    <div class="section">
        <h2>1. Your Location</h2>
        <p id="location">Detecting your location...</p>
    </div>

    <div class="section">
        <h2>2. ISS Flyover Times</h2>
        <div class="output" id="issData">Loading ISS data...</div>
    </div>

    <div class="section">
        <h2>3. Astronomy Picture of the Day</h2>
        <div class="output" id="apodData">Loading picture...</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
